<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-label="Unearth, by Samay Wadhwani">
<defs>
<radialGradient id="g"><stop offset="0" stop-color="#F2A22A" stop-opacity=".6"/><stop offset="1" stop-color="#F2A22A" stop-opacity="0"/></radialGradient>
<linearGradient id="u" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFD166"/><stop offset="1" stop-color="#F2A22A"/></linearGradient>
<clipPath id="c"><rect width="1280" height="300" rx="20"/></clipPath>
<clipPath id="ground"><rect width="1280" height="160"/></clipPath>
</defs>
<style>
text{font-family:ui-rounded,"SF Pro Rounded",-apple-system,"Segoe UI",Helvetica,Arial,sans-serif}
.t{opacity:.16;animation:find 7s linear infinite}
.light{transform:translateX(640px);animation:sweep 7s linear infinite}
.word{animation:rise 1.3s cubic-bezier(.16,1,.3,1) .2s backwards}
.by{animation:show .8s ease-out 1.1s backwards}
.line{transform-origin:640px 160px;animation:grow 1s cubic-bezier(.16,1,.3,1) backwards}
.dot{animation:pulse 2.4s ease-in-out infinite;transform-origin:center;transform-box:fill-box}
@keyframes find{0%{opacity:1;transform:translateY(-9px)}16%{opacity:.16;transform:none}91%{opacity:.16;transform:none}100%{opacity:1;transform:translateY(-9px)}}
@keyframes sweep{from{transform:translateX(-90px)}to{transform:translateX(1370px)}}
@keyframes rise{from{transform:translateY(120px)}}
@keyframes show{from{opacity:0}}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes pulse{50%{transform:scale(1.35)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.t{opacity:.5}}
</style>
<g clip-path="url(#c)"><rect width="1280" height="300" fill="#14221A"/>
<g class="light"><circle cy="252" r="190" fill="url(#g)"/></g>
